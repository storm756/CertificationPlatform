# Local development. Run from the repo root:
#   docker compose -f deploy/compose.dev.yml up
name: csfr-dev

x-web-env: &web-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DJANGO_SECRET_KEY: dev-only-not-a-secret
  DB_HOST: db
  DB_NAME: csfr
  DB_USER: postgres # superuser in dev so pytest can create its test database
  DB_PASSWORD: dev
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"

services:
  web:
    build:
      context: ..
      args:
        REQUIREMENTS: requirements-dev.txt
    command: python manage.py runserver 0.0.0.0:8000
    environment: *web-env
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  tasks:
    # Daily jobs (D27): same image and code as web, running the periodic loop.
    build:
      context: ..
      args:
        REQUIREMENTS: requirements-dev.txt
    command: python manage.py run_periodic
    # Connects as csfr_app (the limited runtime role), like production. The role is created by
    # the db service's init scripts, so an existing dev database needs `down -v` once.
    environment:
      <<: *web-env
      DB_USER: csfr_app
      DB_PASSWORD: dev
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: csfr
      DB_OWNER_PASSWORD: dev # used by init-roles.sh, same script as production
      DB_APP_PASSWORD: dev
    volumes:
      - dev-db:/var/lib/postgresql/data
      - ./db/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
      - ./db/dev-grants.sh:/docker-entrypoint-initdb.d/20-dev-grants.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d csfr"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI

volumes:
  dev-db:
