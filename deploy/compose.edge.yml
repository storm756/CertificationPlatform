# The shared front door: Caddy owns ports 80/443, gets the TLS certificates and routes by host name
# to the staging and prod stacks. Installed and started only by `deploy/deploy.sh edge`, which copies this
# file to /srv/csfr/edge/ and runs it from there (never from an env checkout).
name: csfr-edge

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      # Local testing only: EDGE_HTTP_PORT / EDGE_HTTPS_PORT move Caddy off 80/443 (never on the server).
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
      - "${EDGE_HTTPS_PORT:-443}:443/udp"
    environment:
      PROD_DOMAIN: ${PROD_DOMAIN:-cyberfirstresponse.io}
      STAGING_DOMAIN: ${STAGING_DOMAIN:-staging.cyberfirstresponse.io}
      # Local testing only: set to "http://" to disable HTTPS (never on the server).
      SCHEME: ${SCHEME:-}
    volumes:
      # /srv/csfr/edge/caddy, written only by deploy/edge.sh. A directory, not one file, so a changed file is seen.
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
      - prod-static:/srv/prod/static:ro
      - staging-static:/srv/staging/static:ro
      # read-only: Caddy sends /learn/media files only after Django answers with X-Accel-Redirect
      - prod-media:/srv/prod/media:ro
      - staging-media:/srv/staging/media:ro
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks: [edge]

networks:
  edge:
    name: csfr-edge
    external: true # created by deploy/edge.sh and deploy.sh

volumes:
  caddy-data:
  caddy-config:
  prod-static:
    external: true
    name: csfr-prod_static
  staging-static:
    external: true
    name: csfr-staging_static
  prod-media:
    external: true
    name: csfr-prod_media
  staging-media:
    external: true
    name: csfr-staging_media
