name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: csfr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Deploy checks against prod settings
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-this-is-a-long-random-looking-string-0123456789-abcdefghij
          DJANGO_ALLOWED_HOSTS: cyberfirstresponse.io
      - run: pytest

  deploy-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck --severity=warning deploy/*.sh deploy/db/*.sh deploy/backup/*.sh deploy/server/*.sh
      - name: Compose files are valid
        env:
          CSFR_ENV: staging
          CSFR_ENV_FILE: ${{ github.workspace }}/deploy/env.staging.example
          CSFR_DB_ENV_FILE: ${{ github.workspace }}/deploy/env.db.example
        run: |
          docker network create csfr-edge
          docker compose -f deploy/compose.dev.yml config -q
          docker compose -f deploy/compose.yml config -q
      - name: Caddyfile is valid
        run: |
          docker run --rm -e PROD_DOMAIN=example.org -e STAGING_DOMAIN=staging.example.org \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile
      - name: Images build
        run: |
          docker build -t csfr-web:ci .
          docker build -t csfr-backup:ci deploy/backup
