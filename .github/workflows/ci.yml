name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: csfr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: WeasyPrint system libraries (certificate PDFs)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -r requirements-dev.txt
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Deploy checks against prod settings
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-this-is-a-long-random-looking-string-0123456789-abcdefghij
          DJANGO_ALLOWED_HOSTS: cyberfirstresponse.io
      - run: pytest

  e2e:
    # Journeys 1-16 (architecture §18) against a throwaway dev server on an empty database. The seed
    # builds an invented course, so no private content is needed. Pull requests only.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: csfr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.21
        ports: ["1025:1025", "8025:8025"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASSWORD: ci
      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: WeasyPrint system libraries (certificate PDFs)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Database, invented data, dev server
        run: |
          python manage.py migrate
          python manage.py e2e_seed > e2e/manifest.json
          nohup python manage.py runserver 0.0.0.0:8000 --noreload > runserver.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:8000/healthz/ && break; sleep 1; done
      - name: Journeys 1-16
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8000
          MAILPIT_URL: http://127.0.0.1:8025
        run: npx playwright test
      - name: Keep the report and the server log when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/report
            e2e/test-results
            runserver.log
          retention-days: 7

  deploy-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck --severity=warning deploy/*.sh deploy/db/*.sh deploy/backup/*.sh deploy/server/*.sh
      - name: Compose files are valid
        env:
          CSFR_ENV: staging
          CSFR_ENV_FILE: ${{ github.workspace }}/deploy/env.staging.example
          CSFR_DB_ENV_FILE: ${{ github.workspace }}/deploy/env.db.example
        run: |
          docker network create csfr-edge
          docker compose -f deploy/compose.dev.yml config -q
          docker compose -f deploy/compose.yml config -q
      - name: Caddyfile is valid
        run: |
          docker run --rm -e PROD_DOMAIN=example.org -e STAGING_DOMAIN=staging.example.org \
            -v "$PWD/deploy/caddy:/etc/caddy:ro" caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile
      - name: Images build
        run: |
          docker build -t csfr-web:ci .
          docker build -t csfr-backup:ci deploy/backup
