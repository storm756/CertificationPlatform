{% load allauth %}
<div class="field{% if attrs.errors %} field--error{% endif %}">
  {% if attrs.type == "checkbox" or attrs.type == "radio" %}
    <label class="check" for="{{ attrs.id }}"><input {% if attrs.name %}name="{{ attrs.name }}" {% endif %}{% if attrs.id %}id="{{ attrs.id }}" {% endif %}{% if attrs.checked %}checked {% endif %}{% if attrs.value is not None %}value="{{ attrs.value }}" {% endif %}type="{{ attrs.type }}"><span>{% slot label %}{% endslot %}</span></label>
  {% else %}
    <label for="{{ attrs.id }}">{% slot label %}{% endslot %}</label>
    <input class="input" {% if attrs.required %}required {% endif %}{% if attrs.name %}name="{{ attrs.name }}" {% endif %}{% if attrs.id %}id="{{ attrs.id }}" {% endif %}{% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}" {% endif %}{% if attrs.value is not None %}value="{{ attrs.value }}" {% endif %}type="{{ attrs.type }}">
  {% endif %}
  {% if slots.help_text %}<p class="hint">{% slot help_text %}{% endslot %}</p>{% endif %}
  {{ attrs.errors }}
</div>
