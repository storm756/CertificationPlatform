[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"apps/content/legacy.py" = ["E501"]  # long literal rows from the legacy data
"apps/content/docx.py" = ["E501"]
"apps/content/blocks.py" = ["E501"]
"apps/content/views.py" = ["E501"]
"apps/results/*.py" = ["E501"]
"apps/assessments/programme.py" = ["E501"]
"apps/assessments/views.py" = ["E501"]
"apps/assessments/admin.py" = ["E501"]
"apps/assessments/examsets.py" = ["E501"]
"apps/assessments/management/commands/import_final_sets.py" = ["E501"]  # one report line per row
"tests/**" = ["S105", "S106", "E501"]  # long lines in test data and docstrings are fine

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
